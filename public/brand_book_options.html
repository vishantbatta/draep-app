<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>draep — Brand Book Options · 20 Directions</title>
<meta name="description" content="Twenty brand book directions for draep — one message, twenty palettes, twenty temperaments. Custom-stitched is cool; you carry the responsibility to beautify the world; this is the safe space to do it your way.">
<style>
:root{
  --night:#0A0114; --night2:#150829; --panel:#1D1130; --line:rgba(255,255,255,.1);
  --text:#EFE9FA; --muted:#A79BC4; --cream:#F5E7AE;
  --grad:linear-gradient(90deg,#FABB30 0%,#EF655B 45%,#F604A4 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--night);color:var(--text);display:flex;flex-direction:column}
a.skip{position:absolute;left:-9999px;top:8px;z-index:50;background:var(--night2);color:var(--cream);padding:10px 18px;border-radius:8px;border:1px solid var(--line)}
a.skip:focus{left:12px}
:focus-visible{outline:3px solid #FABB30;outline-offset:2px;border-radius:4px}

.app{display:flex;flex:1;min-height:0;height:100vh}

/* ---- left nav ---- */
nav{width:300px;flex-shrink:0;background:var(--night2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.nav-head{padding:22px 22px 18px;border-bottom:1px solid var(--line)}
.nav-head .mark{font-family:Poppins,system-ui,sans-serif;font-weight:700;font-size:24px;letter-spacing:.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nav-head .sub{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.nav-head .sub b{color:var(--text);font-weight:600}
.nav-list{flex:1;overflow-y:auto;padding:10px 10px 16px;list-style:none}
.nav-list li{margin:2px 0}
.nav-list button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--muted);font-family:inherit}
.nav-list button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav-list button[aria-current="true"]{background:rgba(255,255,255,.07);color:var(--text);box-shadow:inset 3px 0 0 0 #F604A4}
.nav-list .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);width:20px;flex-shrink:0}
.nav-list button[aria-current="true"] .n{color:var(--cream)}
.nav-list .names{flex:1;min-width:0}
.nav-list .nm{font-size:13.5px;font-weight:600;display:block}
.nav-list .ds{font-size:11px;color:var(--muted);display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-list .dots{display:flex;gap:4px;flex-shrink:0}
.nav-list .dots i{width:9px;height:9px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.18)}
.nav-foot{padding:14px 22px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.55}
.nav-foot a{color:var(--cream)}

/* ---- main ---- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--night)}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;clip:rect(0 0 0 0);clip-path:inset(50%);overflow:hidden;white-space:nowrap}
.topbar .now{font-size:14px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .now b{color:var(--text);font-weight:600}
.topbar .open{flex-shrink:0;font:inherit;font-size:12.5px;font-weight:600;color:var(--night);background:var(--cream);border:none;border-radius:999px;padding:8px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.topbar .open:hover{background:#fff}
iframe{flex:1;width:100%;border:none;background:#fff}

@media (max-width:880px){
  .app{flex-direction:column;height:auto}
  nav{width:100%;max-height:44vh;border-right:none;border-bottom:1px solid var(--line)}
  main{height:100vh}
  .nav-list{max-height:26vh}
}
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W65GGBHB"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<a class="skip" href="#frame">Skip to the variation</a>
<div class="app">
  <nav aria-label="Brand book variations">
    <div class="nav-head">
      <div class="mark" aria-hidden="true">draep</div>
      <div class="sub"><b>Brand Book Options</b> · 20 directions, one message</div>
    </div>
    <ol class="nav-list" id="navList"></ol>
    <div class="nav-foot">
      Every direction passes WCAG 2.1 AA (contrast-verified).
      Current full edition: <a href="/brand_book_nature">Nature Edition ↗</a>
    </div>
  </nav>
  <main id="main">
    <h1 class="vh">draep — Brand Book Options, twenty directions</h1>
    <div class="topbar">
      <div class="now" id="now">Loading…</div>
      <a class="open" id="openFull" href="/brand_book_options/v1.html" target="_blank" rel="noopener">Open full ↗</a>
    </div>
    <iframe id="frame" src="/brand_book_options/v1.html" title="Brand book variation"></iframe>
  </main>
</div>

<script>
(function(){
  var V = [
    {id:'v1',  name:'Editorial Warmth',  sub:'The Craft Journal',    dots:['#A63A1B','#FAF3E7','#2B1D12']},
    {id:'v2',  name:'Midnight Neon',     sub:'After Dark',           dots:['#B8FF29','#FF4FC3','#0A0A12']},
    {id:'v3',  name:'Botanical',         sub:'The Garden Ledger',    dots:['#93D6A4','#F2A9C7','#0D231A']},
    {id:'v4',  name:'Blueprint',         sub:'The Atelier Draft',    dots:['#FFFFFF','#FFE08A','#16337F']},
    {id:'v5',  name:'Candy Pop',         sub:'Joy Riot',             dots:['#FFD60A','#FF7ABA','#2E0A54']},
    {id:'v6',  name:'Gallery Minimal',   sub:'The White Wall',       dots:['#002FA7','#FCFBF8','#101010']},
    {id:'v7',  name:'Retro Sunbeam',     sub:'Golden Hour \u201977', dots:['#BE4E17','#F4E7D3','#7A3E12']},
    {id:'v8',  name:'Ocean Luxe',        sub:'Deep Calm',            dots:['#E7C377','#7FD9D6','#06182A']},
    {id:'v9',  name:'Swiss Brutal',      sub:'Plain Speaking',       dots:['#D9400F','#0B0B0B','#FFFFFF']},
    {id:'v10', name:'Aurora Dusk',       sub:'Northern Lights',      dots:['#7FE7C9','#B39BF7','#0A0B24']},
    {id:'v11', name:'Riso Zine',         sub:'Photocopy Dreams',     dots:['#1F3BB3','#C2185B','#FAF5EC']},
    {id:'v12', name:'Sumi Ink',          sub:'The Quiet Brush',      dots:['#B3261E','#F6F1E7','#1F1B16']},
    {id:'v13', name:'CRT Terminal',      sub:'Stitch.exe',           dots:['#53FF96','#FFC24D','#07100B']},
    {id:'v14', name:'Couture Noir',      sub:'Maison draep',         dots:['#B31324','#FFFFFF','#111111']},
    {id:'v15', name:'Varsity Athletic',  sub:'Team You',             dots:['#FFB612','#101F3C','#F7F3E8']},
    {id:'v16', name:'Memphis Milano',    sub:'Pattern Riot',         dots:['#1D4ED8','#FFD60A','#C11F2C']},
    {id:'v17', name:'Desert Adobe',      sub:'High Desert Studio',   dots:['#8C3D1F','#45523A','#F3E8D4']},
    {id:'v18', name:'Y2K Chrome',        sub:'Beauty v2000',         dots:['#FF7AB8','#6FF0D6','#1C1030']},
    {id:'v19', name:'Scrapbook Stitch',  sub:'The Keepsake Book',    dots:['#A82E20','#2B4A8C','#EFE2C8']},
    {id:'v20', name:'Denim Workwear',    sub:'Indigo Hours',         dots:['#F2C94C','#33547E','#7A4A2B']}
  ];
  var list = document.getElementById('navList');
  var frame = document.getElementById('frame');
  var now = document.getElementById('now');
  var openFull = document.getElementById('openFull');

  V.forEach(function(v, i){
    var li = document.createElement('li');
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.idx = i;
    b.innerHTML = '<span class="n">' + String(i+1).padStart(2,'0') + '</span>' +
      '<span class="names"><span class="nm">' + v.name + '</span><span class="ds">' + v.sub + '</span></span>' +
      '<span class="dots" aria-hidden="true">' + v.dots.map(function(c){return '<i style="background:'+c+'"></i>';}).join('') + '</span>';
    b.addEventListener('click', function(){ show(i); });
    li.appendChild(b);
    list.appendChild(li);
  });
  var buttons = list.querySelectorAll('button');

  function show(i){
    var v = V[i];
    buttons.forEach(function(b, j){ b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
    frame.src = '/brand_book_options/' + v.id + '.html';
    frame.title = 'draep brand book variation ' + (i+1) + ' of 20 — ' + v.name;
    now.innerHTML = 'Direction <b>' + String(i+1).padStart(2,'0') + ' — ' + v.name + '</b> · ' + v.sub;
    openFull.href = '/brand_book_options/' + v.id + '.html';
    document.title = 'draep — ' + v.name + ' · Brand Book Options';
    if (history.replaceState) history.replaceState(null, '', '#v' + (i+1));
    buttons[i].scrollIntoView({block:'nearest'});
  }

  var m = (location.hash.match(/^#v(\d{1,2})$/) || location.search.match(/[?&]v=(\d{1,2})/));
  var start = m ? Math.min(19, Math.max(0, parseInt(m[1],10) - 1)) : 0;
  show(start);

  // arrow-key navigation across the list
  document.addEventListener('keydown', function(e){
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    var idx = Array.prototype.indexOf.call(buttons, document.activeElement);
    if (idx === -1) return;
    e.preventDefault();
    var next = e.key === 'ArrowDown' ? Math.min(buttons.length - 1, idx + 1) : Math.max(0, idx - 1);
    buttons[next].focus();
    show(next);
  });
})();
</script>
